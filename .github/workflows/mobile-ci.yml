name: Mobile CI — Jest (pose)

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile/src/pose/**"
      - "mobile/src/**/__tests__/**"
      - "mobile/package.json"
      - ".github/workflows/mobile-ci.yml"

jobs:
  test:
    name: Run Jest (src/pose)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest (pose module only)
        run: npx jest src/pose --passWithNoTests --ci --coverage
