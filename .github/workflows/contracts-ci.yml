name: Contract Validators

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/contracts/**"

jobs:
  validate:
    name: Validate contract schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node deps (for ajv validator)
        run: npm ci

      - name: Install Python deps (for jsonschema validator)
        run: pip install jsonschema

      - name: Run JS validator
        run: node docs/contracts/validate.js

      - name: Run Python validator
        run: python docs/contracts/validate.py
