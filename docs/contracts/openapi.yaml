openapi: "3.1.0"
info:
  title: AxioMedica Tele-Rehab API
  description: Backend API service for AxioMedica tele-rehabilitation platform, supporting kinematic session sync, clinician plan management, and voice guidance.
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      summary: Root health check
      responses:
        "200":
          description: Service healthy

  /api/v1/health:
    get:
      summary: API and database health check
      responses:
        "200":
          description: API and DB connected successfully

  /api/v1/auth/register:
    post:
      summary: Register a new patient account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
      responses:
        "201":
          description: Account created

  /api/v1/auth/login:
    post:
      summary: User login (Patient or Clinician)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT Access and Refresh tokens

  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token

  /api/v1/patients/me:
    get:
      summary: Get authenticated patient profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient profile

  /api/v1/sessions/sync:
    post:
      summary: Batch upload a completed rehabilitation session (Idempotent)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./session_payload.schema.json"
      responses:
        "200":
          description: Session was already synced (idempotent response)
        "201":
          description: Session created and daily metrics updated
        "400":
          description: Contract validation error

  /api/v1/sessions:
    get:
      summary: List authenticated patient sessions
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated sessions list

  /api/v1/exercises:
    get:
      summary: List catalog of rehabilitation exercises
      responses:
        "200":
          description: Exercise catalog list

  /api/v1/plans/active:
    get:
      summary: Get active approved rehabilitation plan for current patient
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active plan with prescribed exercises

  /api/v1/clinician/plans:
    post:
      summary: Create customized rehabilitation plan for a patient
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Plan created in draft or active state

  /api/v1/clinician/plans/{id}/approve:
    put:
      summary: Clinician approves and activates a rehabilitation plan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Plan approved and activated

  /api/v1/progress/summary:
    get:
      summary: Get patient recovery progress overview
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recovery progress summary

  /api/v1/progress/rom-trend:
    get:
      summary: Get joint range-of-motion progress trend over time
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of date vs ROM measurements

  /api/v1/pain-logs:
    post:
      summary: Record daily pain entry
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Pain score recorded

  /api/v1/tts:
    post:
      summary: Synthesize text into WAV streaming speech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Streaming audio/wav response
          content:
            audio/wav:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
